[project]
name = "merton-credit-risk"
version = "0.1.0"
description = "Comparing Structural and Reduced-Form Credit Risk Models: Merton, VK, and Hull-White"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "yfinance>=0.2.18",
    "fredapi>=0.5",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "jupyter>=1.0",
    "notebook>=7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
